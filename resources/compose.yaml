services:
  fpm:
    build:
      context: ..
      dockerfile: resources/Dockerfile
      target: dev
    volumes:
      - "../:/opt/app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - XDEBUG_SESSION=1
      - PHP_IDE_CONFIG="serverName=qc-service"
    networks:
      default:
        aliases:
          - fpm

  nginx:
    image: nginx:alpine
    volumes:
      - "../:/opt/app"
      - "./rootfs/etc/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template"
    environment:
      - SERVER_NAME=0.0.0.0
      - SERVER_PORT=9111
      - SERVER_ROOT=/opt/app/public
      - SERVER_FPM_URL=fpm:9000
    ports:
      - "9111:9111"

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: database
      POSTGRES_PASSWORD: database
      POSTGRES_USER: database
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "database", "-U", "database" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    ports:
      - "5432"

volumes:
  database_data:
